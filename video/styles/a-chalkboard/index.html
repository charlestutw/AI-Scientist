<!doctype html>
<html lang="zh-Hant" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
@font-face { font-family: WenKai; src: url(./fonts/wenkai.woff2) format("woff2"); }
@font-face { font-family: NotoSansTC; font-weight: 500; src: url(./fonts/sans500.woff2) format("woff2"); }
@font-face { font-family: NotoSansTC; font-weight: 900; src: url(./fonts/sans900.woff2) format("woff2"); }
@font-face { font-family: NotoSerifTC; font-weight: 500; src: url(./fonts/serif500.woff2) format("woff2"); }
@font-face { font-family: NotoSerifTC; font-weight: 900; src: url(./fonts/serif900.woff2) format("woff2"); }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
#root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
.layer { position: absolute; inset: 0; }
#electron, .ghost { position: absolute; left: 0; top: 0; border-radius: 50%; }
.sub { position: absolute; left: 0; right: 0; text-align: center; }
#qmark { position: absolute; }
#elabel { position: absolute; left: 0; top: 0; padding-top: 150px; white-space: nowrap; line-height: 1.1; }

body { background: #1d3b2f; }
#root { background: radial-gradient(ellipse at 50% 40%, #2a5141 0%, #1d3b2f 55%, #142a21 100%); font-family: WenKai, sans-serif; color: #f2efe4; }
.chalk { filter: url(#rough); }
#electron { width: 58px; height: 58px; border: 5px solid #f2efe4; background: #1d3b2f; display: grid; place-items: center; font-size: 44px; line-height: 1; }
#elabel { font-size: 40px; color: #f7e27a; }
.ghost { width: 22px; height: 22px; background: #f2efe4; filter: url(#rough); }
.lbl { position: absolute; font-size: 40px; color: #f7e27a; }
.sub { bottom: 120px; font-size: 92px; letter-spacing: 0.04em; text-shadow: 0 0 2px rgba(242,239,228,.6); }
.sub em { font-style: normal; color: #f7e27a; }
#qmark { left: 1290px; top: 200px; font-size: 300px; color: #f7a27a; filter: url(#rough); }
.dust { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: linear-gradient(#0000, #00000040); }
.tray { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: #6b4a2b; box-shadow: 0 -4px 0 #4e341d; }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      
<svg class="layer" width="1920" height="1080">
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feComposite in="d" in2="n" operator="in"/>
    </filter>
  </defs>
  <g id="orbit" class="chalk" fill="none" stroke="#f2efe4" stroke-width="5" stroke-linecap="round" stroke-dasharray="26 16" opacity=".9">
    <circle cx="960" cy="430" r="330"/>
  </g>
  <g id="nucleus" class="chalk" style="transform-origin:960px 430px">
    <circle cx="960" cy="430" r="62" fill="none" stroke="#f7a27a" stroke-width="7"/>
    <path d="M960 405 V455 M935 430 H985" stroke="#f7a27a" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g class="chalk" fill="none" stroke="#f7e27a" stroke-width="4" stroke-linecap="round">
    <path d="M1120 250 C1080 300 1040 340 1010 380"/><path d="M1010 380 l6 -22 M1010 380 l20 -6"/>
  </g>
</svg>
<div class="lbl" style="left:1130px;top:190px">原子核</div>
<div class="dust"></div><div class="tray"></div>

      <div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div>
      <div id="electron">−</div>
      <div id="elabel" class="elbl">電子</div>
      <div id="qmark" class="clip" data-start="10" data-duration="2" data-track-index="2">？</div>
      <div id="s1-sub-1" class="sub clip" data-start="0" data-duration="2" data-track-index="1">電子一直繞著<em>原子核</em>轉</div><div id="s1-sub-2" class="sub clip" data-start="2" data-duration="2" data-track-index="1">照舊物理的算法……</div><div id="s1-sub-3" class="sub clip" data-start="4" data-duration="2" data-track-index="1">它會<em>漏掉能量</em></div><div id="s1-sub-4" class="sub clip" data-start="6" data-duration="2" data-track-index="1">然後<em>掉進</em>原子核</div><div id="s1-sub-5" class="sub clip" data-start="8" data-duration="2" data-track-index="1">可是，氫原子好好的</div><div id="s1-sub-6" class="sub clip" data-start="10" data-duration="2" data-track-index="1">為什麼？<em>先猜猜看</em></div>
    </div>
    
<script src="./gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  const CX = 960, CY = 430, RX = 330, RY = 330, TILT = 0;
  const e = document.getElementById("electron");
  const ghosts = Array.from(document.querySelectorAll(".ghost"));
  const st = { ang: -0.6, rad: 1, trail: 0, alive: 1 };
  const cos = Math.cos(TILT), sin = Math.sin(TILT);
  function place(el, a, r) {
    const x = RX * r * Math.cos(a), y = RY * r * Math.sin(a);
    const px = CX + x * cos - y * sin, py = CY + x * sin + y * cos;
    el.style.transform = `translate(${px}px, ${py}px) translate(-50%, -50%) scale(${0.35 + 0.65 * r})`;
  }
  const lb = document.getElementById("elabel");
  function render() {
    place(e, st.ang, st.rad);
    place(lb, st.ang, st.rad);
    e.style.opacity = st.alive;
    lb.style.opacity = st.alive;
    ghosts.forEach((g, i) => {
      const k = i + 1;
      place(g, st.ang - k * 0.16, Math.min(1, st.rad + k * 0.03 * (1 - st.rad)));
      g.style.opacity = st.trail * st.alive * (1 - k / (ghosts.length + 1));
    });
  }
  tl.to(st, { ang: -0.6 + Math.PI * 2 * 5, duration: 12, ease: "none", onUpdate: render }, 0);
  tl.to(st, { trail: 1, duration: 0.6, onUpdate: render }, 4);
  tl.to(st, { rad: 0.02, duration: 1.8, ease: "power2.in", onUpdate: render }, 6);
  tl.to(st, { alive: 0, duration: 0.2, onUpdate: render }, 7.7);
  tl.to("#nucleus", { scale: 1.25, duration: 0.15, yoyo: true, repeat: 1 }, 7.8);
  tl.set(st, { rad: 1, trail: 0, onUpdate: render }, 8);
  tl.to(st, { alive: 1, duration: 0.5, onUpdate: render }, 8.1);
  tl.fromTo("#orbit", { opacity: 1 }, { opacity: 0.25, duration: 0.6 }, 6);
  tl.to("#orbit", { opacity: 1, duration: 0.5 }, 8.1);
  tl.fromTo("#qmark", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 10);
  document.querySelectorAll(".sub").forEach((s) => {
    const t0 = parseFloat(s.dataset.start);
    tl.fromTo(s, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, t0);
  });
  render();
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>

  </body>
</html>
