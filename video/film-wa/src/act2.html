
          <!-- ================= ACT 2 一串神祕的數字 ================= -->
          <section id="act2" class="act full clip" data-start="{{ACT2_T}}" data-duration="{{ACT2_D}}" data-track-index="0">
            <canvas id="a2-canvas" class="full" width="1920" height="1080"></canvas>
            <svg id="a2-year" class="full v" width="1920" height="1080" style="transform-origin:960px 400px">
              <defs><linearGradient id="a2-ygrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#1e1b18"/><stop offset="1" stop-color="#2b4c7e"/></linearGradient></defs>
              <path id="a2-yfill" d="{{PATH_Y1885}}" fill="#1e1b18" opacity="0" style="filter:)"/>
              <path id="a2-yline" d="{{PATH_Y1885}}" fill="none" stroke="#1e1b18" stroke-width="2" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
            </svg>
            <div id="a2-basel" class="abs mono" style="left:0;width:1920px;top:620px;text-align:center;font-size:30px;color:var(--ice)">BASEL · 巴塞爾</div>
            <div id="a2-ychip" class="chip abs mono v" style="left:72px;top:118px">1885 · BASEL</div>

            <!-- Balmer card + age ring -->
            <div id="a2-balmer" class="full v">
              <div class="card abs" style="left:560px;top:330px"><div id="a2-bname" class="nm">J. J. BALMER</div><div class="rl">數學家</div></div>
              <svg class="abs" width="220" height="220" style="left:1120px;top:300px">
                <g id="a2-ticks"></g>
                <circle cx="110" cy="110" r="64" fill="none" stroke="rgba(43,76,126,.18)" stroke-width="1"/>
              </svg>
              <div id="a2-age" class="abs num" style="left:1120px;top:362px;width:220px;text-align:center;font-size:72px;line-height:1">0</div>
              <div class="abs" style="left:1120px;top:440px;width:220px;text-align:center;font-size:24px;color:rgba(30,27,24,.8)">歲</div>
            </div>

            <!-- hydrogen tube -->
            <svg id="a2-hglyph" class="full v" width="1920" height="1080"><path d="{{PATH_HYDROGEN}}" fill="none" stroke="#8b6bb1" stroke-opacity=".35" stroke-width="2"/></svg>
            <div id="a2-tube" class="abs v" style="left:660px;top:168px;width:600px;height:84px;border-radius:42px;border:2px solid rgba(139,107,177,.85);
              background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(139,107,177,.55) 45%, rgba(200,68,47,.45));
              ">
              <div class="abs" style="left:0;width:600px;top:14px;text-align:center;font-size:44px;font-weight:900;color:#1e1b18;">氫</div>
            </div>
            <div id="a2-beam" class="abs v" style="left:956px;top:252px;width:8px;height:218px;transform-origin:50% 0;background:#8b6bb1;"></div>

            <!-- spectrum band (the "few thin lines") -->
            <div id="a2-sci" class="full">
              <svg id="a2-band" class="full v" width="1920" height="1080">
                <rect x="410" y="470" width="1100" height="110" rx="4" fill="#ece5d7" stroke="rgba(43,76,126,.35)"/>
                <g id="a2-lines"></g>
                <g id="a2-ruler" opacity="0"></g>
                <g id="a2-arcs"></g>
              </svg>
              <div id="a2-lnums"></div>
              <div id="a2-flarehost" class="full"></div>
            </div>

            <!-- formula cards -->
            <div id="a2-formula" class="panel abs v" style="left:660px;top:160px;width:600px;height:100px">
              <div id="a2-ftext" class="abs" style="left:0;width:600px;top:22px;text-align:center;font-size:46px;font-weight:700;white-space:pre">位置 = <span class="num" style="font-style:italic;color:var(--ice)">f(n)</span></div>
              <div id="a2-fcursor" class="abs" style="left:470px;top:28px;width:4px;height:46px;background:var(--ice);opacity:0"></div>
            </div>
            <div id="a2-formula2" class="panel abs v" style="left:560px;top:160px;width:800px;height:100px;border-color:rgba(43,76,126,.7)">
              <div class="abs" style="left:0;width:800px;top:22px;text-align:center;font-size:46px;font-weight:700;white-space:nowrap">位置 = <span class="num" style="font-style:italic;color:var(--ice)">F( … )</span></div>
            </div>
            <div id="a2-upgrade" class="chip abs mono v" style="left:1190px;top:132px;border-color:var(--mint);color:var(--mint)">UPGRADE · 通用版</div>
            <div id="a2-hexes" class="abs v" style="left:520px;top:120px;width:880px;height:180px;border-radius:50%;background:radial-gradient(ellipse, rgba(43,76,126,.18), transparent 70%)"></div>

            <!-- 1888 / Rydberg -->
            <div id="a2-y1888" class="abs num yearbig v" style="left:0;width:1920px;top:150px;text-align:center"><span>188</span><span id="a2-lastd" style="display:inline-block;position:relative;width:.62em;height:1em;vertical-align:top"><span class="abs" style="left:0;top:0;width:100%;text-align:center">5</span><span class="abs" style="left:0;top:0;width:100%;text-align:center">6</span></span></div>
            <div id="a2-rydberg" class="card abs v" style="left:1250px;top:610px"><div class="nm">J. RYDBERG</div></div>

            <!-- three samples -->
            <div id="a2-samples" class="full v" style="perspective:1400px">
              <div id="a2-sampleplane" class="full" style="transform:rotateX(16deg);transform-origin:960px 560px">
                <svg class="full" width="1920" height="1080" id="a2-sbands"></svg>
              </div>
              <svg class="full" width="1920" height="1080" id="a2-sbeams"></svg>
            </div>

            <!-- prediction: extended band -->
            <div id="a2-ext" class="full v">
              <svg class="full" width="1920" height="1080" id="a2-extsvg">
                <rect x="110" y="470" width="300" height="110" fill="#ece5d7" stroke="rgba(139,107,177,.35)" stroke-dasharray="6 6"/>
                <rect x="1510" y="470" width="300" height="110" fill="#ece5d7" stroke="rgba(139,107,177,.35)" stroke-dasharray="6 6"/>
                <path d="M410 444 V430 H1510 V444" fill="none" stroke="rgba(30,27,24,.7)" stroke-width="2"/>
              </svg>
              <div class="abs" style="left:0;width:1920px;top:376px;text-align:center;font-size:30px;font-weight:500;color:#1e1b18">看得見的範圍</div>
              <div class="a2-unseen abs mono" style="left:110px;width:300px;top:604px;text-align:center;font-size:22px;color:#8b6bb1">UNSEEN ?</div>
              <div class="a2-unseen abs mono" style="left:1510px;width:300px;top:604px;text-align:center;font-size:22px;color:#8b6bb1">UNSEEN ?</div>
              <div id="a2-ghosthost" class="full"></div>
            </div>
            <div id="a2-confirm" class="chip abs mono v" style="left:0;top:660px;width:1920px;text-align:center;border:none;background:none;font-size:30px;color:var(--mint);">✓ CONFIRMED</div>

            <!-- analogy: LED bus board -->
            <div id="a2-board" class="abs v" style="left:520px;top:150px;width:880px;height:600px;background:#fbf8f2;border:2px solid #1e1b18">
              <svg id="a2-leds" class="abs" width="880" height="600" style="left:0;top:0"></svg>
              <div class="abs" style="left:0;top:0;width:876px;height:110px;background:#c8442f"></div>
              <div class="abs" style="left:56px;top:28px;font-size:48px;font-weight:900;color:#f6efe3;letter-spacing:.3em">公車時刻表</div>
              <div class="abs mono" style="right:56px;top:42px;font-size:28px;color:#f6efe3">BUS 42</div>
              <div class="a2-row abs num" style="left:80px;top:140px;font-size:72px;color:#1e1b18;letter-spacing:.12em">08:00</div>
              <div class="a2-row abs num" style="left:80px;top:226px;font-size:72px;color:#1e1b18;letter-spacing:.12em">08:15</div>
              <div class="a2-row abs num" style="left:80px;top:312px;font-size:72px;color:#1e1b18;letter-spacing:.12em">08:30</div>
              <div class="a2-row abs num" style="left:80px;top:398px;font-size:72px;color:#1e1b18;letter-spacing:.12em">08:45</div>
              <div class="abs" style="left:56px;right:56px;top:226px;height:1px;background:rgba(30,27,24,.15)"></div>
              <div class="abs" style="left:56px;right:56px;top:312px;height:1px;background:rgba(30,27,24,.15)"></div>
              <div class="abs" style="left:56px;right:56px;top:398px;height:1px;background:rgba(30,27,24,.15)"></div>
              <div id="a2-who" class="abs v" style="left:80px;top:505px;font-size:44px;font-weight:800;color:#c8442f">排班者：<span id="a2-whoq">？？？</span></div>
            </div>
          </section>
