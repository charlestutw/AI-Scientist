
          <!-- ================= ACT 2 一串神祕的數字 ================= -->
          <section id="act2" class="act full clip" data-start="{{ACT2_T}}" data-duration="{{ACT2_D}}" data-track-index="0">
            <canvas id="a2-canvas" class="full" width="1920" height="1080"></canvas>
            <svg id="a2-year" class="full v" width="1920" height="1080" style="transform-origin:960px 400px">
              <defs><linearGradient id="a2-ygrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#d6f8ff"/><stop offset="1" stop-color="#7fe8ff"/></linearGradient></defs>
              <path id="a2-yfill" d="{{PATH_Y1885}}" fill="url(#a2-ygrad)" opacity="0" style="filter:drop-shadow(0 0 26px rgba(43,184,255,.5))"/>
              <path id="a2-yline" d="{{PATH_Y1885}}" fill="none" stroke="#d6f8ff" stroke-width="2" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
            </svg>
            <div id="a2-basel" class="abs mono" style="left:0;width:1920px;top:620px;text-align:center;font-size:30px;color:var(--ice)">BASEL · 巴塞爾</div>
            <div id="a2-ychip" class="chip abs mono v" style="left:72px;top:118px">1885 · BASEL</div>

            <!-- Balmer card + age ring -->
            <div id="a2-balmer" class="full v">
              <div class="card abs" style="left:560px;top:330px"><div id="a2-bname" class="nm">J. J. BALMER</div><div class="rl">數學家</div></div>
              <svg class="abs" width="220" height="220" style="left:1120px;top:300px">
                <g id="a2-ticks"></g>
                <circle cx="110" cy="110" r="64" fill="none" stroke="rgba(127,232,255,.18)" stroke-width="1"/>
              </svg>
              <div id="a2-age" class="abs num" style="left:1120px;top:362px;width:220px;text-align:center;font-size:72px;line-height:1">0</div>
              <div class="abs" style="left:1120px;top:440px;width:220px;text-align:center;font-size:24px;color:rgba(214,248,255,.8)">歲</div>
            </div>

            <!-- hydrogen tube -->
            <svg id="a2-hglyph" class="full v" width="1920" height="1080"><path d="{{PATH_HYDROGEN}}" fill="none" stroke="#c9a7ff" stroke-opacity=".35" stroke-width="2"/></svg>
            <div id="a2-tube" class="abs v" style="left:660px;top:168px;width:600px;height:84px;border-radius:42px;border:2px solid rgba(240,220,255,.85);
              background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(201,167,255,.55) 45%, rgba(255,138,216,.45));
              box-shadow:0 0 30px 8px rgba(201,167,255,.55), 0 0 120px 40px rgba(255,138,216,.22), inset 0 0 24px rgba(255,255,255,.6)">
              <div class="abs" style="left:0;width:600px;top:14px;text-align:center;font-size:44px;font-weight:900;color:#fff;text-shadow:0 0 16px #ff8ad8">氫</div>
            </div>
            <div id="a2-beam" class="abs v" style="left:956px;top:252px;width:8px;height:218px;transform-origin:50% 0;background:linear-gradient(#f3e3ff,#c9a7ff);box-shadow:0 0 20px 6px rgba(201,167,255,.7)"></div>

            <!-- spectrum band (the "few thin lines") -->
            <div id="a2-sci" class="full">
              <svg id="a2-band" class="full v" width="1920" height="1080">
                <rect x="410" y="470" width="1100" height="110" rx="4" fill="#02030b" stroke="rgba(127,232,255,.35)"/>
                <g id="a2-lines"></g>
                <g id="a2-ruler" opacity="0"></g>
                <g id="a2-arcs"></g>
              </svg>
              <div id="a2-lnums"></div>
              <div id="a2-flarehost" class="full"></div>
            </div>

            <!-- formula cards -->
            <div id="a2-formula" class="panel abs v" style="left:660px;top:160px;width:600px;height:100px">
              <div id="a2-ftext" class="abs" style="left:0;width:600px;top:22px;text-align:center;font-size:46px;font-weight:700;white-space:pre">位置 = <span class="num" style="font-style:italic;color:var(--ice)">f(n)</span></div>
              <div id="a2-fcursor" class="abs" style="left:470px;top:28px;width:4px;height:46px;background:var(--ice);opacity:0"></div>
            </div>
            <div id="a2-formula2" class="panel abs v" style="left:560px;top:160px;width:800px;height:100px;border-color:rgba(127,232,255,.7)">
              <div class="abs" style="left:0;width:800px;top:22px;text-align:center;font-size:46px;font-weight:700;white-space:nowrap">位置 = <span class="num" style="font-style:italic;color:var(--ice)">F( … )</span></div>
            </div>
            <div id="a2-upgrade" class="chip abs mono v" style="left:1190px;top:132px;border-color:var(--mint);color:var(--mint)">UPGRADE · 通用版</div>
            <div id="a2-hexes" class="abs v" style="left:520px;top:120px;width:880px;height:180px;border-radius:50%;background:radial-gradient(ellipse, rgba(127,232,255,.18), transparent 70%)"></div>

            <!-- 1888 / Rydberg -->
            <div id="a2-y1888" class="abs num yearbig v" style="left:0;width:1920px;top:150px;text-align:center"><span>188</span><span id="a2-lastd" style="display:inline-block;position:relative;width:.62em;height:1em;vertical-align:top"><span class="abs" style="left:0;top:0;width:100%;text-align:center">5</span><span class="abs" style="left:0;top:0;width:100%;text-align:center">6</span></span></div>
            <div id="a2-rydberg" class="card abs v" style="left:1250px;top:610px"><div class="nm">J. RYDBERG</div></div>

            <!-- three samples -->
            <div id="a2-samples" class="full v" style="perspective:1400px">
              <div id="a2-sampleplane" class="full" style="transform:rotateX(16deg);transform-origin:960px 560px">
                <svg class="full" width="1920" height="1080" id="a2-sbands"></svg>
              </div>
              <svg class="full" width="1920" height="1080" id="a2-sbeams"></svg>
            </div>

            <!-- prediction: extended band -->
            <div id="a2-ext" class="full v">
              <svg class="full" width="1920" height="1080" id="a2-extsvg">
                <rect x="110" y="470" width="300" height="110" fill="#02030b" stroke="rgba(155,140,255,.35)" stroke-dasharray="6 6"/>
                <rect x="1510" y="470" width="300" height="110" fill="#02030b" stroke="rgba(155,140,255,.35)" stroke-dasharray="6 6"/>
                <path d="M410 444 V430 H1510 V444" fill="none" stroke="rgba(214,248,255,.7)" stroke-width="2"/>
              </svg>
              <div class="abs" style="left:0;width:1920px;top:376px;text-align:center;font-size:30px;font-weight:500;color:#d6f8ff">看得見的範圍</div>
              <div class="a2-unseen abs mono" style="left:110px;width:300px;top:604px;text-align:center;font-size:22px;color:#c7bfff">UNSEEN ?</div>
              <div class="a2-unseen abs mono" style="left:1510px;width:300px;top:604px;text-align:center;font-size:22px;color:#c7bfff">UNSEEN ?</div>
              <div id="a2-ghosthost" class="full"></div>
            </div>
            <div id="a2-confirm" class="chip abs mono v" style="left:0;top:660px;width:1920px;text-align:center;border:none;background:none;font-size:30px;color:var(--mint);text-shadow:0 0 16px rgba(108,255,200,.8)">✓ CONFIRMED</div>

            <!-- analogy: LED bus board -->
            <div id="a2-board" class="abs v" style="left:500px;top:150px;width:920px;height:600px;border-radius:14px;border:2px solid rgba(255,173,66,.6);
              background:linear-gradient(180deg,#1a1006,#0b0703);box-shadow:0 0 60px rgba(255,173,66,.18), inset 0 0 50px rgba(0,0,0,.8)">
              <svg id="a2-leds" class="abs" width="920" height="600" style="left:0;top:0"></svg>
              <div class="abs" style="left:56px;top:40px;font-size:44px;font-weight:900;color:#ffd08a;letter-spacing:.1em">公車時刻表</div>
              <div class="abs mono" style="right:56px;top:52px;font-size:26px;color:var(--amber)">BUS 42</div>
              <div class="abs" style="left:56px;right:56px;top:116px;height:2px;background:rgba(255,173,66,.4)"></div>
              <div class="a2-row abs mono" style="left:56px;top:150px;font-size:58px;color:var(--amber);text-shadow:0 0 14px rgba(255,173,66,.8);letter-spacing:.15em">08:00</div>
              <div class="a2-row abs mono" style="left:56px;top:238px;font-size:58px;color:var(--amber);text-shadow:0 0 14px rgba(255,173,66,.8);letter-spacing:.15em">08:15</div>
              <div class="a2-row abs mono" style="left:56px;top:326px;font-size:58px;color:var(--amber);text-shadow:0 0 14px rgba(255,173,66,.8);letter-spacing:.15em">08:30</div>
              <div class="a2-row abs mono" style="left:56px;top:414px;font-size:58px;color:var(--amber);text-shadow:0 0 14px rgba(255,173,66,.8);letter-spacing:.15em">08:45</div>
              <div id="a2-who" class="abs v" style="left:56px;top:508px;font-size:42px;font-weight:700;color:var(--coral);text-shadow:0 0 14px rgba(255,92,138,.8)">排班者：<span id="a2-whoq">？？？</span></div>
              <div class="abs" style="inset:0;border-radius:14px;background:radial-gradient(circle, rgba(0,0,0,0) 1.2px, rgba(0,0,0,.35) 1.6px) 0 0/6px 6px"></div>
            </div>
          </section>
