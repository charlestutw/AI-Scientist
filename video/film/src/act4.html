
          <!-- ================= ACT 4 反轉 ================= -->
          <section id="act4" class="act full clip" data-start="{{ACT4_T}}" data-duration="{{ACT4_D}}" data-track-index="0">
            <svg width="0" height="0" class="abs"><defs>
              <filter id="a4-rough" x="-5%" y="-5%" width="110%" height="110%">
                <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4" result="n"/>
                <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G" result="d"/>
                <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="8" result="g"/>
                <feComponentTransfer in="g" result="g2"><feFuncA type="discrete" tableValues="1 1 1 0.2"/></feComponentTransfer>
                <feComposite in="d" in2="g2" operator="in"/>
              </filter>
            </defs></svg>
            <div id="a4-frozen" class="full" style="transform-origin:960px 500px;transform:translate(-60px,0) scale(.86)">

                <rect x="520" y="690" width="220" height="12" fill="#ffad42" opacity=".9"/>
                <path d="M440 690 H740 V585 H960 V480 H1180 V375 H1400" fill="none" stroke="#7fe8ff" stroke-opacity=".18" stroke-width="16"/>
                <path d="M440 690 H740 V585 H960 V480 H1180 V375 H1400" fill="none" stroke="#d6f8ff" stroke-width="3"/>
                <path id="a4-wave" fill="none" stroke="#7fe8ff" stroke-width="4" d=""/>
                <circle cx="850" cy="568" r="13" fill="#f4fdff"/>
              </svg>
              <div class="abs" style="left:1460px;top:540px;width:380px;height:90px;border:1px solid rgba(127,232,255,.4);border-radius:4px;background:#02030b">

                <div class="abs" style="left:250px;top:6px;width:5px;height:78px;background:#7fe8ff"></div><div class="abs" style="left:330px;top:6px;width:5px;height:78px;background:#ff7a9a"></div>
              </div>
              <div id="a4-scan" class="abs v" style="left:300px;width:1500px;top:300px;height:3px;background:rgba(127,232,255,.8);box-shadow:0 0 14px #7fe8ff"></div>
            </div>
            <div id="a4-pause" class="abs mono v" style="left:0;width:1920px;top:150px;text-align:center;font-size:44px;color:#fff;text-shadow:0 0 16px rgba(255,255,255,.6)">▌▌ PAUSE</div>
            <div id="a4-derive" class="abs v" style="left:180px;top:330px;font-size:84px;font-weight:900;color:#d6f8ff;white-space:nowrap">推導 →
              <svg class="abs" width="420" height="140" style="left:-20px;top:-10px;overflow:visible"><path id="a4-strike" d="M0 120 L400 10" stroke="#ff5c8a" stroke-width="10" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" style="filter:drop-shadow(0 0 10px rgba(255,92,138,.9))"/></svg>
            </div>
            <div id="a4-stampwrap" class="abs v" style="left:0;top:110px;width:1920px;height:640px;perspective:1200px">
              <div id="a4-stamp" class="abs stamp" style="left:385px;top:20px;width:1150px;height:600px;color:#ff5c8a;filter:url(#a4-rough) drop-shadow(0 0 30px rgba(255,92,138,.5));transform-origin:960px 320px">

                <div id="a4-w2" class="abs" style="left:0;top:22px;width:1130px;text-align:center;font-size:500px;line-height:1;opacity:0">假設</div>
