    <script src="./gsap.min.js"></script>
    <script>
      // ---------- deterministic helpers ----------
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const SVGNS = "http://www.w3.org/2000/svg";
      const FPS = 30, FILM = 4090 / FPS;          // full film length per 分鏡.md
      const ACT_BOUNDS = [436, 1325, 2141, 2488, 3564].map((f) => f / FPS);
      const T = { s1: 0, s2: 2.7, s3: 4.8667, s4: 6.6667, s5: 9.0333, end: 10 };

      // ---------- background ----------
      (function stars() {
        const r = rng(11), g = document.getElementById("stars");
        for (let i = 0; i < 220; i++) {
          const c = document.createElementNS(SVGNS, "circle");
          c.setAttribute("cx", (r() * 1920).toFixed(1)); c.setAttribute("cy", (r() * 1080).toFixed(1));
          c.setAttribute("r", (0.5 + r() * 1.4).toFixed(2)); c.setAttribute("fill", "#cfe8ff");
          c.setAttribute("opacity", (0.15 + r() * 0.6).toFixed(2)); g.appendChild(c);
        }
        const s = document.getElementById("streaks"), r2 = rng(5);
        for (let i = 0; i < 140; i++) {
          const a = r2() * Math.PI * 2, d0 = 80 + r2() * 700, len = 120 + r2() * 420;
          const l = document.createElementNS(SVGNS, "line");
          l.setAttribute("x1", 960 + Math.cos(a) * d0); l.setAttribute("y1", 430 + Math.sin(a) * d0);
          l.setAttribute("x2", 960 + Math.cos(a) * (d0 + len)); l.setAttribute("y2", 430 + Math.sin(a) * (d0 + len));
          l.setAttribute("stroke", i % 5 ? "#bfe9ff" : "#5ee7ff"); l.setAttribute("stroke-width", (0.6 + r2() * 1.6).toFixed(2));
          l.setAttribute("stroke-opacity", (0.25 + r2() * 0.6).toFixed(2)); s.appendChild(l);
        }
        // panel data stream
        const r3 = rng(77); let rows = [];
        for (let i = 0; i < 24; i++) { let row = ""; for (let j = 0; j < 4; j++) row += Math.floor(r3() * 65536).toString(16).toUpperCase().padStart(4, "0") + "  "; rows.push(row.trim()); }
        document.getElementById("pstream-in").textContent = rows.join("\n");
        // progress ticks
        const prog = document.getElementById("prog");
        ACT_BOUNDS.forEach((b) => { const t = document.createElement("div"); t.className = "tick"; t.style.left = (b / FILM) * 1776 + "px"; prog.appendChild(t); });
      })();

      // ---------- electron simulation (pure function of time) ----------
      const CX = 960, CY = 430, RX = 380, RY = 150, TILT = (-20 * Math.PI) / 180;
      const W0 = (Math.PI * 2) / 2.4;
      const C0 = T.s4 + 0.1, CD = 1.35;            // collapse in sim-time
      const SLOW_AT = C0 + 1.2, SLOW = 0.25;        // last 0.15 sim-s plays at 0.25x
      const IMPACT = SLOW_AT + (C0 + CD - SLOW_AT) / SLOW;   // real time of impact
      const RW0 = T.s5, RW1 = T.s5 + 0.5;           // rewind window (real time)
      const DT = 1 / 240, hist = [];               // sampled history, index = step
      (function integrate() {
        let ang = -0.6, t = 0;
        for (let i = 0; t <= 12; i++, t += DT) {
          const r = radiusAt(t);
          const w = t < RW0 ? W0 / Math.pow(Math.max(r, 0.18), 1.4) : (t < RW1 ? -W0 * 3.2 : W0);
          const step = DT * simRate(t);
          hist.push({ ang, r });
          ang += w * step;
        }
      })();
      function simRate(t) { return t >= SLOW_AT && t < IMPACT ? SLOW : 1; }
      function simTime(t) { return t < SLOW_AT ? t : (t < IMPACT ? SLOW_AT + (t - SLOW_AT) * SLOW : C0 + CD + (t - IMPACT)); }
      function radiusAt(t) {
        if (t < C0) return 1;
        if (t < IMPACT) { const p = Math.min(1, (simTime(t) - C0) / CD); return 1 - Math.pow(p, 2.2) * 0.98; }
        if (t < RW0) return 0.02;
        if (t < RW1) { const p = (t - RW0) / (RW1 - RW0); return 0.02 + 0.98 * (1 - Math.pow(1 - p, 3)); }
        return 1;
      }
      function stateAt(t) { const i = Math.max(0, Math.min(hist.length - 1, Math.round(t / DT))); return hist[i]; }
      function pos(a, r) { const x = RX * r * Math.cos(a), y = RY * r * Math.sin(a);
        return [CX + x * Math.cos(TILT) - y * Math.sin(TILT), CY + x * Math.sin(TILT) + y * Math.cos(TILT)]; }

      const el = document.getElementById("electron"), lb = document.getElementById("elabel");
      const NG = 12, NP = 54, ghosts = [], parts = [];
      for (let i = 0; i < NG; i++) { const g = document.createElement("div"); g.className = "abs e ghost"; document.getElementById("ghosts").appendChild(g); ghosts.push(g); }
      const pr = rng(31);
      for (let i = 0; i < NP; i++) {
        const p = document.createElement("div"); p.className = "abs e pt"; document.getElementById("parts").appendChild(p);
        const born = T.s3 + 0.15 + (i / NP) * (IMPACT - T.s3 - 0.3) + pr() * 0.05;
        parts.push({ p, born, a: pr() * Math.PI * 2, v: 40 + pr() * 90, life: 0.9 + pr() * 0.8 });
      }
      function trailAmt(t) {               // 0..1 how long/visible the trail is
        if (t < T.s3) return 0.25;
        if (t < T.s3 + 0.5) return 0.25 + 0.75 * ((t - T.s3) / 0.5);
        if (t < RW1) return 1;
        return 0.25;
      }
      function alive(t) { if (t < IMPACT) return 1; if (t < RW0) return 0; return Math.min(1, (t - RW0) / 0.15); }
      function place(node, x, y, s) { node.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${s})`; }
      function draw(t) {
        const st = stateAt(t), [x, y] = pos(st.ang, st.r), a = alive(t), s = 0.4 + 0.6 * st.r;
        place(el, x, y, s); el.style.opacity = a;
        place(lb, x, y, 1); lb.style.opacity = a * labelOn(t);
        const tr = trailAmt(t);
        ghosts.forEach((g, k) => {
          const lag = (k + 1) * (0.018 + 0.03 * tr), sg = stateAt(Math.max(0, t - lag)), [gx, gy] = pos(sg.ang, sg.r);
          place(g, gx, gy, (0.35 + 0.6 * sg.r) * (1 - k / (NG + 2)));
          g.style.opacity = a * (k < 3 + 9 * tr ? 1 : 0) * (0.7 - k * 0.05) * (0.35 + 0.65 * tr);
        });
        parts.forEach((q) => {
          const age = t - q.born;
          if (age < 0 || age > q.life || t > RW0) { q.p.style.opacity = 0; return; }
          const sb = stateAt(q.born), [bx, by] = pos(sb.ang, sb.r);
          place(q.p, bx + Math.cos(q.a) * q.v * age, by + Math.sin(q.a) * q.v * age + 18 * age * age, 1 - age / q.life * 0.5);
          q.p.style.opacity = (1 - age / q.life) * 0.9;
        });
      }
      let labelOn = (t) => (t < 1.4 ? 0 : Math.min(1, (t - 1.4) / 0.4)) * (t > T.s4 ? Math.max(0, 1 - (t - T.s4) / 0.3) : 1);

      // ---------- subtitles ----------
      const GLYPHS = "■□◆◇０１２３４５６７８９";
      document.querySelectorAll(".sub .txt").forEach((txt) => {
        const walk = (node, into) => {
          [...node.childNodes].forEach((n) => {
            if (n.nodeType === 3) {
              [...n.textContent].forEach((c) => { const s = document.createElement("span"); s.className = "ch w"; s.textContent = c; s.dataset.c = c; into.appendChild(s); });
            } else {
              const e2 = n.cloneNode(false); into.appendChild(e2); walk(n, e2);
              const ul = document.createElement("span"); ul.className = "ul"; e2.appendChild(ul);
            }
          });
        };
        const tmp = txt.cloneNode(true); txt.innerHTML = ""; walk(tmp, txt);
      });

      const tl = gsap.timeline({ paused: true });
      const IR = { immediateRender: false };

      // ---------- master clock drives the physics ----------
      const clock = { t: 0 };
      tl.to(clock, { t: 10, duration: 10, ease: "none", onUpdate: () => draw(clock.t) }, 0);

      // ---------- opening: black -> point -> push-in ----------
      tl.to("#fade", { opacity: 0, duration: 0.6, ease: "power2.out" }, 0);
      tl.fromTo("#obj", { scale: 0.28, opacity: 0.0 }, { scale: 1, opacity: 1, duration: 1.1, ease: "expo.out", ...IR }, 0.25);
      tl.fromTo("#stars", { scale: 0.75 }, { scale: 1, duration: 1.4, ease: "expo.out", ...IR }, 0.2);
      tl.fromTo("#streaks", { scale: 0.5, opacity: 0 }, { keyframes: [{ scale: 1.1, opacity: 0.9, duration: 0.35, ease: "power2.in" }, { scale: 1.9, opacity: 0, duration: 0.6, ease: "expo.out" }], ...IR }, 0.2);
      tl.fromTo("#grid", { opacity: 0 }, { opacity: 0.35, duration: 1.2, ...IR }, 0.6);
      tl.fromTo("#bgword", { opacity: 0, x: 80 }, { opacity: 0.08, x: 0, duration: 1.4, ease: "expo.out", ...IR }, 0.5);
      tl.to("#bgword", { x: -90, duration: 8, ease: "none" }, 1.9);
      tl.fromTo(".orb", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.9, ease: "expo.out", ...IR }, 0.55);
      tl.to("#nleader", { attr: { "stroke-dashoffset": 0 }, duration: 0.4, ease: "power2.out" }, 1.3);
      tl.fromTo("#nlabel", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", ...IR }, 1.55);
      tl.to(["#nlabel", "#nleader"], { opacity: 0, duration: 0.25 }, T.s4);

      // ---------- HUD ----------
      tl.fromTo("#hud", { opacity: 0 }, { opacity: 1, duration: 0.6, ...IR }, 0.4);
      tl.fromTo("#progfill", { scaleX: 0 }, { scaleX: 10 / FILM, duration: 10, ease: "none", ...IR }, 0);
      tl.to("#badgering", { rotation: 90, svgOrigin: "50 50", duration: 10, ease: "none" }, 0);
      tl.to(".corner", { opacity: 0.25, duration: 1.2, yoyo: true, repeat: 7, ease: "sine.inOut" }, 0.6);
      decodeText(document.getElementById("actno"), "ACT 01", 0.5, 0.6, "0123456789#/_");
      decodeText(document.getElementById("actname"), "／ 拋出問題", 0.65, 0.6, "■□◆◇");

      // ---------- shot 2: classical sim panel + camera pan ----------
      tl.to("#world", { x: -80, duration: 0.9, ease: "expo.inOut" }, T.s2 + 0.1);
      tl.set("#panel", { opacity: 1 }, T.s2 + 0.15);
      tl.fromTo("#panel .glass", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 0.45, ease: "expo.out", ...IR }, T.s2 + 0.15);
      tl.fromTo("#panel .scan", { opacity: 0 }, { keyframes: [{ opacity: 1, duration: 0.08 }, { opacity: 0, duration: 0.3 }], stagger: 0.05, ...IR }, T.s2 + 0.15);
      tl.fromTo("#panel .br", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out", ...IR }, T.s2 + 0.3);
      tl.fromTo(["#plabel", "#pbar", "#pnum", "#pstream"], { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.06, ease: "expo.out", ...IR }, T.s2 + 0.4);
      decodeText(document.getElementById("ptitle"), "CLASSICAL / SIM", T.s2 + 0.3, 0.7, "#$%&*+0123456789");
      tl.fromTo("#pstream-in", { y: 0 }, { y: -400, duration: 7, ease: "none", ...IR }, T.s2 + 0.4);

      // energy: 100 -> 35 during shot 3/4, odometer + bar
      const energy = { v: 100 };
      function drawEnergy() {
        const v = energy.v, h = 48;
        const fl = Math.floor(v), fr = v - fl, sm = (x) => x * x * (3 - 2 * x);
        const onesOff = (fl % 10) + sm(Math.max(0, Math.min(1, (fr - 0.85) / 0.15)));
        const tensOff = (Math.floor(fl / 10) % 10) + Math.max(0, onesOff - 9);
        rollDigit("d2", onesOff); rollDigit("d1", tensOff);
                document.getElementById("d0").style.opacity = v >= 99.5 ? 1 : 0;
        document.getElementById("pfill").style.transform = `scaleX(${v / 100})`;
      }
      function rollDigit(id, off) {   // fade-roll: current digit slides up & fades, next rises in
        const col = document.getElementById(id), a = col.children[0], b = col.children[1];
        const d = Math.floor(off), q = off - d;
        a.textContent = String(d % 10); b.textContent = String((d + 1) % 10);
        a.style.transform = `translateY(${-q * 50}px)`; a.style.opacity = 1 - q;
        b.style.transform = `translateY(${(1 - q) * 50}px)`; b.style.opacity = q;
      }
      drawEnergy();
      tl.to(energy, { v: 35, duration: IMPACT - T.s3 - 0.1, ease: "power1.in", onUpdate: drawEnergy }, T.s3 + 0.1);

      // ---------- shot 3: weight morph on 漏掉能量 ----------
      tl.fromTo(".wmorph .ch", { fontWeight: 900 }, { fontWeight: 300, duration: 1.1, ease: "power2.inOut", stagger: 0.08, ...IR }, T.s3 + 0.55);

      // ---------- shot 4: collapse, slow-mo, impact ----------
      tl.to("#obj", { scale: 1.32, duration: IMPACT - (T.s4 + 0.6), ease: "power2.in" }, T.s4 + 0.6);
      tl.to(".orb", { attr: { "stroke-opacity": 0.12 }, duration: 0.6 }, T.s4 + 0.2);
      tl.to(":root", { "--hud": "#ff4d9a", duration: 0.2 }, T.s4 + 0.3);
      tl.to("#pwarn", { opacity: 1, duration: 0.1, repeat: 5, yoyo: true }, T.s4 + 0.3);
      tl.set("#neg", { opacity: 1 }, IMPACT);
      tl.set("#neg", { opacity: 0 }, IMPACT + 2 / FPS);
      tl.set("#impactword", { opacity: 1 }, IMPACT);
      tl.set("#impactword", { opacity: 0 }, IMPACT + 2 / FPS);
      tl.fromTo("#nucleus", { scale: 1 }, { keyframes: [{ scale: 1.35, duration: 0.08 }, { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.4)" }], ...IR }, IMPACT);
      tl.fromTo("#shock", { scale: 0.4, opacity: 1 }, { scale: 9, opacity: 0, duration: 0.7, ease: "expo.out", ...IR }, IMPACT);
      tl.fromTo("#flare", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.18, ease: "expo.out", ...IR }, IMPACT);
      tl.to("#flare", { opacity: 0, duration: 0.45 }, IMPACT + 0.18);
      shake("#stage", IMPACT, 0.28, 10, 41);
      tl.to("#obj", { scale: 1.12, duration: 0.4, ease: "expo.out" }, IMPACT + 0.05);

      // ---------- shot 5: VHS rewind ----------
      tl.fromTo("#rewind", { opacity: 0, scaleX: 1.5 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "expo.out", ...IR }, T.s5);
      tl.to("#rewind", { opacity: 0.35, duration: 0.12, repeat: 3, yoyo: true }, T.s5 + 0.35);
      tl.fromTo(".tear", { opacity: 0, y: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.05 }, { y: 120, duration: 0.45, ease: "none" }, { opacity: 0, duration: 0.05 }], stagger: 0.03, ...IR }, RW0);
      tl.set("#obj", { filter: "drop-shadow(8px 0 0 rgba(255,77,154,.75)) drop-shadow(-8px 0 0 rgba(94,231,255,.75))" }, RW0);
      tl.set("#obj", { filter: "none" }, RW1);
      tl.to("#obj", { scale: 1, duration: 0.5, ease: "expo.out" }, RW0);
      tl.to(".orb-line", { attr: { "stroke-opacity": 0.85 }, duration: 0.3 }, RW1 - 0.2);
      tl.to(".orb-glow", { attr: { "stroke-opacity": 0.16 }, duration: 0.3 }, RW1 - 0.2);
      tl.to(energy, { v: 100, duration: 0.5, ease: "expo.out", onUpdate: drawEnergy }, RW0);
      tl.to("#pwarn", { opacity: 0, duration: 0.1 }, RW0);
      tl.fromTo("#flash", { opacity: 0 }, { keyframes: [{ opacity: 0.55, duration: 1 / FPS }, { opacity: 0, duration: 0.25 }], ...IR }, RW1);
      tl.to(":root", { "--hud": "#5ee7ff", duration: 0.2 }, RW1);

      // ---------- subtitle reveals ----------
      document.querySelectorAll(".sub").forEach((sub) => {
        const t0 = parseFloat(sub.dataset.start) + parseFloat(sub.dataset.delay || 0.08);
        const t1 = parseFloat(sub.dataset.start) + parseFloat(sub.dataset.duration);
        const chars = [...sub.querySelectorAll(".ch")], ems = [...sub.querySelectorAll("em")], uls = [...sub.querySelectorAll(".ul")];
        const meta = sub.querySelector(".meta"), txt = sub.querySelector(".txt"), kind = sub.dataset.reveal;
        tl.fromTo(meta, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out", ...IR }, t0 - 0.05);
        if (kind === "rise") {
          tl.fromTo(chars, { opacity: 0, y: 36, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, stagger: 0.03, ease: "expo.out", ...IR }, t0);
        } else if (kind === "decode") {
          tl.set(chars, { opacity: 1 }, t0);
          chars.forEach((c, i) => {
            const o = { p: 0 }, lock = 0.25 + (i / chars.length) * 0.6, r = rng(1000 + i);
            const seq = Array.from({ length: 40 }, () => GLYPHS[Math.floor(r() * GLYPHS.length)]);
            tl.fromTo(o, { p: 0 }, { p: 1, duration: 0.75, ease: "none", ...IR, onUpdate: () => {
              c.textContent = o.p >= lock ? c.dataset.c : seq[Math.floor(o.p * 39)];
              c.style.color = o.p >= lock ? "" : "rgba(94,231,255,.8)";
            } }, t0);
          });
        } else if (kind === "scan") {
          tl.set(chars, { opacity: 1 }, t0);
          const wrap = document.createElement("span"); wrap.className = "scanwrap"; const line = document.createElement("span"); line.className = "scanline"; wrap.appendChild(line); txt.appendChild(wrap);
          tl.fromTo(txt, { clipPath: "inset(-40% 100% -40% 0)" }, { clipPath: "inset(-40% 0% -40% 0)", duration: 0.75, ease: "power2.inOut", ...IR }, t0);
          tl.fromTo(wrap, { xPercent: -100, opacity: 1 }, { xPercent: 0, opacity: 1, duration: 0.75, ease: "power2.inOut", ...IR }, t0);
          tl.to(wrap, { opacity: 0, duration: 0.2 }, t0 + 0.75);
        } else if (kind === "slam") {
          tl.set(chars, { opacity: 1 }, t0);
          tl.fromTo(txt, { scale: 1.8, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power4.in", ...IR }, t0);
          shake(sub, t0 + 0.22, 0.2, 6, 7);
          if (ems.length) tl.fromTo(ems, { color: "#ffffff" }, { color: "#5ee7ff", duration: 0.2, ...IR }, t0 + 0.22 + 2 / FPS);
        }
        if (uls.length) tl.fromTo(uls, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "expo.out", ...IR }, t0 + 0.45);
        if (ems.length) tl.fromTo(ems, { textShadow: "0 0 22px rgba(0,183,255,.75), 0 0 60px rgba(0,183,255,.35)" },
          { keyframes: [{ textShadow: "0 0 34px rgba(160,240,255,1), 0 0 110px rgba(0,183,255,.7)", duration: 0.25 },
            { textShadow: "0 0 22px rgba(0,183,255,.75), 0 0 60px rgba(0,183,255,.35)", duration: 0.45 }], ...IR }, t0 + 0.5);
        if (t1 < 10) {
          tl.to(chars, { opacity: 0, y: -18, filter: "blur(6px)", duration: 0.25, stagger: 0.012, ease: "power2.in" }, t1 - 0.3);
          tl.to([meta, ...uls], { opacity: 0, duration: 0.2 }, t1 - 0.25);
        }
      });

      // ---------- helpers that add to tl ----------
      function decodeText(node, final, t0, d, glyphs) {
        const o = { p: 0 }, chars = [...final];
        node.textContent = "";
        tl.fromTo(o, { p: 0 }, { p: 1, duration: d, ease: "none", ...IR, onUpdate: () => {
          const frame = Math.floor(o.p * d * FPS);
          node.textContent = chars.map((c, i) => {
            const lock = (i + 1) / (chars.length + 1);
            if (o.p >= lock || c === " ") return c;
            return o.p * 1.6 > lock ? glyphs[Math.floor(rng(i * 131 + frame * 7 + 3)() * glyphs.length)] : "";
          }).join("");
        } }, t0);
      }
      function shake(target, t0, d, amp, seed) {
        const r = rng(seed), n = Math.round(d * FPS), kf = [];
        for (let i = 0; i < n; i++) { const k = 1 - i / n; kf.push({ x: (r() * 2 - 1) * amp * k, y: (r() * 2 - 1) * amp * k, duration: 1 / FPS, ease: "none" }); }
        kf.push({ x: 0, y: 0, duration: 1 / FPS, ease: "none" });
        tl.to(target, { keyframes: kf }, t0);
      }

      draw(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
